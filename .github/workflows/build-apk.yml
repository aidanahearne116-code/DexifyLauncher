name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Add native app-icon plugin
        run: |
          mkdir -p android/app/src/main/java/com/dexify/launcher
          cp native/AppIconPlugin.java native/MainActivity.java android/app/src/main/java/com/dexify/launcher/

      - name: Generate app icons
        run: npx --yes @capacitor/assets generate --android

      - name: Allow launching installed apps (Android 11+ package visibility)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DexifyLauncher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
